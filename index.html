<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGE DEVS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <img src="assets/images/rage.png"
         class="logo"
         alt="RAGE DEVS Logo">

    <button class="menu-btn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="menu-panel" id="menuPanel">
        <img src="assets/images/menu.png" alt="Menu">
    </div>

</header>

<main class="hero">

    <video class="hero-video" autoplay muted loop playsinline>
        <source src="assets/videos/rush-hour.mp4" type="video/mp4">
    </video>

   <a href="#banner" class="learn-more-link">

    <div class="learn-more-container">

        <img src="assets/images/learn-more.png"
             class="learn-more normal"
             alt="Learn More">

        <img src="assets/images/learn-more-hover.png"
             class="learn-more hover"
             alt="Learn More Hover">

        <span class="learn-more-text">LEARN-MORE</span>

    </div>

</a>

</main>
    <section class="banner" id="banner">
    <img src="assets/images/projects.jpeg" alt="RAGE DEVS Banner">
    <div class="banner-text">
        WATCH OUR CURRENT UPDATES
    </div>
    <img src="assets/images/game-logo.png"
     class="rush-logo"
     alt="Rush Hour Logo">
     <img src="assets/images/documentaion.png"
     class="docs-logo"
     alt="Rush Hour Documentation">

<div class="docs-description">
    <a href="https://github.com/lafgo-fc/game-jam-repoooo"
    target="_blank"
    class="docs-link">
    <h2>CHECK THE LATEST GAME DOCS</h2>
</a>
</div>
     <div class="game-description">
    <h2>OUR LATEST GAME</h2>
   <a href="https://lafgo.itch.io/rush-hour"
   target="_blank"
   class="game-link">
    <p>RUSH-HOUR</p>
</a>

</div>
</section>
<script src="script.js"></script>
</body>
</html>
